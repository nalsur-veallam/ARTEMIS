[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "seaborn",
    "scikit-learn",
    "tqdm",
    "openpyxl",
    "pre-commit",
    "pytest",
]

requires-python = "> 3.9"
authors = [
    {name = "Ruslan Mallaev"},
    {name = "Anton Polyansky"},
    {name = "Benjamin Bernrieder"},
]

description = "Molecular communication Toolkit."
readme = "README.md"
classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
    'Operating System :: OS Independent',
]

[project.urls]
repository = 'https://github.com/nalsur-veallam/ARTEMIS'

[project.scripts]
artemis = "artemis.__main__:main"

[tool.setuptools]
packages = ["artemis"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "artemis.__version__"}
